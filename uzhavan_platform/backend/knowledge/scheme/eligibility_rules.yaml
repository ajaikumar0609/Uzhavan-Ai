# Scheme eligibility rules (API contract §6, FP-012).
#
# Policy
# - A rule exists ONLY where the eligibility criteria are explicit in the stored official
#   source text (government_schemes.eligibility, copied from schemes.jsonl, and its
#   source_documents). `criteria_text` quotes that text; `criteria_source_url` is the
#   scheme's official_url.
# - Conditions use ONLY fields the app collects: district_id (farm, else profile),
#   crop_id and area_ha (farm). District lists are written with the SOURCE spellings and
#   mapped to meta ids at load time (an unmapped name is a load error).
# - Anything the app does not collect (land records, income-tax status, caste, owned-land
#   size, off-grid status, notified crop/area lists, ...) is listed under `requires` and
#   yields `more_information_required` with those missing_fields; it is never assumed.
# - "Preference will be given to ..." clauses are priorities, not eligibility, and are ignored.
# - A scheme without a rule → cannot_determine.
#
# Condition keys: field (district_id | crop_id | area_ha), and one of
#   in_districts / not_in_districts (source names), in (ids), max / min (numbers).

version: 1
rules:
  - scheme_id: tn_agrisnet_A_38
    criteria_source_url: https://www.tnagrisnet.tn.gov.in/home/schemes/
    criteria_text: "Cotton growing Farmers of 29 Major cotton growing districts of Cuddalore, Villupuram, Kallakurichi, Karur, Thirupathur, Thiruvannamalai, Salem, Namakkal, Dharmapuri, Krishnagiri, Coimbatore, Thiruppur, Erode, Tiruchirapalli, Perambalur, Ariyalur, Thanjavur, Thiruvarur, Nagapattinam, Mayiladuthurai, Madurai, Theni, Dindigul, Ramanathapuram, Virudhunagar, Sivagangai, Tirunelveli, Tenkasi and Thoothukudi."
    conditions:
      - field: crop_id
        in: [cotton]
      - field: district_id
        in_districts: [Cuddalore, Villupuram, Kallakurichi, Karur, Thirupathur, Thiruvannamalai, Salem, Namakkal, Dharmapuri, Krishnagiri, Coimbatore, Thiruppur, Erode, Tiruchirapalli, Perambalur, Ariyalur, Thanjavur, Thiruvarur, Nagapattinam, Mayiladuthurai, Madurai, Theni, Dindigul, Ramanathapuram, Virudhunagar, Sivagangai, Tirunelveli, Tenkasi, Thoothukudi]

  - scheme_id: tn_agrisnet_A_43
    criteria_source_url: https://www.tnagrisnet.tn.gov.in/home/schemes/
    criteria_text: "Rice growing Farmers of All Districts expect Chennai and Nilgris."
    conditions:
      - field: crop_id
        in: [paddy]
      - field: district_id
        not_in_districts: [Chennai, Nilgiris]

  - scheme_id: tn_agrisnet_A_98
