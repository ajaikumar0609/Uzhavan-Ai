  - scheme_id: central_pmfby
    criteria_source_url: https://pmfby.gov.in/
    criteria_text: "Operational Guidelines effective Kharif 2023, cl. 3.1: all farmers including sharecroppers and tenant farmers growing the notified crops in the notified areas are eligible; farmers must have insurable interest in the insured crops and land."
    conditions: []
    requires: [notified_crop_and_area_for_season, insurable_interest]

  - scheme_id: central_pm_kusum
    criteria_source_url: https://pmkusum.mnre.gov.in/
    criteria_text: "Guidelines 22.07.2019, Component-B: individual farmers supported to install standalone solar agriculture pumps ... for replacement of existing diesel agriculture pumps/irrigation systems in off-grid areas."
    conditions: []
    requires: [existing_diesel_pump, off_grid_location]
