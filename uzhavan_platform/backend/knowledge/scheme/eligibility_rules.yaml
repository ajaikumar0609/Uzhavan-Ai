    criteria_text: "Pulses growing farmers of all Districts (Except Chennai and Nilgiri)"
    conditions:
      - field: crop_id
        in: [black_gram, green_gram]     # the pulses in the app's crop list
      - field: district_id
        not_in_districts: [Chennai, Nilgiri]

  - scheme_id: tn_agrisnet_A_126
